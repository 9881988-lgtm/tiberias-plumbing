<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting | מים ושמש</title>
    <meta name="robots" content="noindex, follow">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #16312f;
        background: #f3faf8;
      }
      main {
        width: min(520px, calc(100% - 32px));
        text-align: center;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
    <script>
      (function () {
        var base = "/tiberias-plumbing/";
        var path = window.location.pathname.toLowerCase();
        var target = base;

        if (
          path.indexOf("ac") !== -1 ||
          path.indexOf("air-conditioner") !== -1 ||
          path.indexOf("conditioner") !== -1 ||
          path.indexOf("mazgan") !== -1
        ) {
          target = base + "ac-cleaning/";
        }

        if (
          path.indexOf("solar") !== -1 ||
          path.indexOf("boiler") !== -1 ||
          path.indexOf("dud") !== -1 ||
          path.indexOf("shemesh") !== -1
        ) {
          target = base + "solar-boilers/";
        }

        window.location.replace(target + window.location.search + window.location.hash);
      }());
    </script>
  </head>
  <body>
    <main>
      <h1>מעבירים לעמוד הנכון</h1>
      <p>אם המעבר לא קרה אוטומטית, פתחו את <a href="/tiberias-plumbing/">האתר הראשי</a>.</p>
    </main>
  </body>
</html>
