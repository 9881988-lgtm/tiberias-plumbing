name: Validate single-app catalogue

on:
  push:
    branches: [main]
    paths:
      - scripts/build-apps-maintenance.php
      - scripts/apps-catalog-template.html
      - scripts/apps-maintenance-README.md
      - structo-robotics/apps.html
      - .github/workflows/apps-maintenance-php.yml
  pull_request:
    paths:
      - scripts/build-apps-maintenance.php
      - scripts/apps-catalog-template.html
      - structo-robotics/apps.html
      - .github/workflows/apps-maintenance-php.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: php -l scripts/build-apps-maintenance.php
      - name: Generate the page using PHP
        run: php scripts/build-apps-maintenance.php
      - name: Confirm committed output matches PHP
        run: |
          php scripts/build-apps-maintenance.php --check
          git diff --exit-code -- structo-robotics/apps.html
      - name: Confirm only ReceiptIL is presented as published
        run: |
          php scripts/build-apps-maintenance.php --stdout > /tmp/apps-catalogue.html
          grep -q 'id6784747059' /tmp/apps-catalogue.html
          unexpected_ids="$(grep -Eo 'id[0-9]{10}' /tmp/apps-catalogue.html | sort -u | grep -v '^id6784747059$' || true)"
          if [ -n "$unexpected_ids" ]; then
            echo "Unexpected App Store identifiers in the single-app catalogue:"
            echo "$unexpected_ids"
            exit 1
          fi
